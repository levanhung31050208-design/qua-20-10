<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Món quà 20/10 ❤️</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #190713;
  color: white;
  font-family: Georgia, serif;
  text-align: center;
}
#start {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 24px;
  background: radial-gradient(circle, #752344, #190713);
}
.gift {
  font-size: 100px;
  animation: float 2s infinite ease-in-out;
}
h1 {
  color: #ffd0e4;
  text-shadow: 0 0 15px #ff4b9a;
}
button {
  padding: 15px 26px;
  border: none;
  border-radius: 30px;
  background: #ed4388;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
#videoScreen {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: black;
  overflow: hidden;
}
#myVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
#backMessage {
  position: absolute;
  top: 15px;
  left: 12px;
  right: 12px;
  color: white;
  font-size: 19px;
  text-shadow: 0 0 8px #ff2f87;
  pointer-events: none;
}
@keyframes float {
  50% { transform: translateY(-14px); }
}
</style>
</head>
<body>
<section id="start">
  <div class="gift">🎁</div>
  <h1>Một món quà dành cho em 🌹</h1>
  <p>Có một điều dễ thương đang chờ em...</p>
  <button onclick="openGift()">MỞ MÓN QUÀ ❤️</button>
</section>
<section id="videoScreen">
  <video id="myVideo" playsinline controls>
    <source src="./hoa.mp4.mp4" type="video/mp4">
    Trình duyệt không phát được video này.
  </video>
  <div id="backMessage">Chúc em 20/10 luôn vui vẻ và hạnh phúc ❤️</div>
</section>
<script>
function openGift() {
  document.getElementById('start').style.display = 'none';
  document.getElementById('videoScreen').style.display = 'block';
  const video = document.getElementById('myVideo');
  video.play().catch(() => {
    video.setAttribute('controls', '');
  });
}
</script>
</body>
</html>
